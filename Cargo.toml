[package]
name = "akshar_ime"
version = "1.2.0"
edition = "2021"
authors = ["Sabin"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tempfile = "3.10"
dirs = "5.0"
serde_json = "1.0"
anyhow = "1.0"
rustc-hash = "1.1"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
unicode-normalization = "0.1"
fst = "0.4"
wasm-bindgen = { version = "=0.2.100", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
web-sys = { version = "=0.3.77", optional = true, features = [
  "Window",
  "Storage",
  "Response",
  "Request",
  "Headers",
  "console",
] }

[features]
default = []
wasm = ["wasm-bindgen", "js-sys", "wasm-bindgen-futures", "getrandom", "web-sys"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false

[lib]
name = "akshar_ime"
crate-type = ["cdylib", "rlib"]

# ------------------------------------------------------------------------------
# Training Pipeline (src/bin/train/)
# ------------------------------------------------------------------------------

[[bin]]
name = "train"
path = "src/bin/train/train.rs"

# ------------------------------------------------------------------------------
# Evaluation & Benchmark Binaries (src/bin/evaluate/)
# ------------------------------------------------------------------------------

[[bin]]
name = "eval_langs"
path = "src/bin/evaluate/eval_langs.rs"

[[bin]]
name = "eval_session"
path = "src/bin/evaluate/eval_session.rs"

[[bin]]
name = "eval_stratified"
path = "src/bin/evaluate/eval_stratified.rs"

# ------------------------------------------------------------------------------
# Data Construction & Utility Binaries (src/bin/build/)
# ------------------------------------------------------------------------------

[[bin]]
name = "prepare_pairs"
path = "src/bin/build/prepare_pairs.rs"

[[bin]]
name = "calibrate_blend"
path = "src/bin/build/calibrate_blend.rs"

[[bin]]
name = "build_lexicon"
path = "src/bin/build/build_lexicon.rs"

[[bin]]
name = "prune_lm"
path = "src/bin/build/prune_lm.rs"

[[bin]]
name = "repack_model"
path = "src/bin/build/repack_model.rs"

[[bin]]
name = "quantize_model"
path = "src/bin/build/quantize_model.rs"

[[bin]]
name = "probe_model"
path = "src/bin/build/probe_model.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1