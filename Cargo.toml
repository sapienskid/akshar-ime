
[package]
name = "akshar_ime"
version = "1.0.0"
edition = "2021"
authors = ["Sabin"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tempfile = "3.10"
libc = "0.2"
dirs = "5.0"
serde_json = "1.0"
wasm-bindgen = { version = "=0.2.100", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
web-sys = { version = "=0.3.77", optional = true, features = [
  "Window",
  "Storage",
  "Response",
  "Request",
  "Headers",
  "console",
] }

[features]
default = []
wasm = ["wasm-bindgen", "js-sys", "wasm-bindgen-futures", "getrandom", "web-sys"]

[lib]
name = "akshar_ime"
crate-type = ["cdylib", "rlib"]

# ------------------------------------------------------------------------------
# Training Binaries (src/bin/train/)
# ------------------------------------------------------------------------------

[[bin]]
name = "train_model"
path = "src/bin/train/train_model.rs"

[[bin]]
name = "train_reranker"
path = "src/bin/train/train_reranker.rs"

[[bin]]
name = "train_matra"
path = "src/bin/train/train_matra.rs"

[[bin]]
name = "train_pair_model"
path = "src/bin/train/train_pair_model.rs"

[[bin]]
name = "train_crf"
path = "src/bin/train/train_crf.rs"

# ------------------------------------------------------------------------------
# Evaluation & Benchmark Binaries (src/bin/evaluate/)
# ------------------------------------------------------------------------------

[[bin]]
name = "evaluate"
path = "src/bin/evaluate/evaluate.rs"

[[bin]]
name = "evaluate_aksharantar"
path = "src/bin/evaluate/evaluate_aksharantar.rs"

[[bin]]
name = "evaluate_model"
path = "src/bin/evaluate/evaluate_model.rs"

[[bin]]
name = "evaluate_pair_model"
path = "src/bin/evaluate/evaluate_pair_model.rs"

[[bin]]
name = "evaluate_context"
path = "src/bin/evaluate/evaluate_context.rs"

[[bin]]
name = "evaluate_matra"
path = "src/bin/evaluate/evaluate_matra.rs"

[[bin]]
name = "evaluate_candidate_union"
path = "src/bin/evaluate/evaluate_candidate_union.rs"

[[bin]]
name = "evaluate_shrinkage"
path = "src/bin/evaluate/evaluate_shrinkage.rs"

[[bin]]
name = "evaluate_nepali_transliteration"
path = "src/bin/evaluate/evaluate_nepali_transliteration.rs"

[[bin]]
name = "analyze_errors"
path = "src/bin/evaluate/analyze_errors.rs"

[[bin]]
name = "verify_parity"
path = "src/bin/evaluate/verify_parity.rs"

# ------------------------------------------------------------------------------
# Data Construction & Utility Binaries (src/bin/build/)
# ------------------------------------------------------------------------------

[[bin]]
name = "build_bigrams"
path = "src/bin/build/build_bigrams.rs"

[[bin]]
