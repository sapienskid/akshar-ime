[[bin]]
name = "build_wordfreq_text"
path = "src/bin/build/build_wordfreq_text.rs"

[[bin]]
name = "probe_model"
path = "src/bin/build/probe_model.rs"

[[bin]]
name = "prune_model"
path = "src/bin/build/prune_model.rs"

[[bin]]
name = "romanize"
path = "src/bin/build/romanize.rs"