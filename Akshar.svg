<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" role="img" aria-label="Akshar">
  <title>Akshar</title>
  <!-- Akshar follows the shared design system: bone glyph, lime nucleus.
