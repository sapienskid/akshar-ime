name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0, leave empty for manual run without release)'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # wasm build only — model artifacts are trained locally and uploaded
    # separately via `make release-upload TAG=...` (data/ is not in CI)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev libjansson-dev brotli

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Build WASM package
        run: bash wasm/build.sh

      - name: Package artifacts
        run: |
          ls -lh wasm/pkg/ js/akshar-ime.js web/index.html data/
          # keep lexicon optional — upload if present (24 MB gzip, slow but GitHub infra fast)
          echo "wasm/pkg sizes:"
          du -sh wasm/pkg/*
          gzip -c wasm/pkg/akshar_ime_bg.wasm | wc -c | awk '{printf "wasm gzip %d KB\n",$1/1024}'

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }} — WASM
          generate_release_notes: true
          files: |
            wasm/pkg/akshar_ime_bg.wasm
            wasm/pkg/akshar_ime.js
            wasm/pkg/akshar_ime.d.ts
            wasm/pkg/akshar_ime_bg.wasm.d.ts
            js/akshar-ime.js
            web/index.html
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Model artifacts (data/translit_model.bin, data/word_freq_text.bin) are
      # NOT built in CI — data/ is not in the repo. Train locally (`make data`)
      # and upload them to the release: `make release-upload TAG=vX.Y.Z`.
